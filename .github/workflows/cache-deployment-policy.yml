name: Cache deployment policy
on:
  push:
    branches: [feature/production-cache-cutover]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/web-cache-deployment-policy.test.mjs
