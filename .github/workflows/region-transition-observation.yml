name: Region transition observation

on:
  schedule:
    - cron: '20 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: region-transition-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check observation window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Seoul date +%F)"
          enabled=true
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]] && { [[ "$today" < '2026-09-15' ]] || [[ "$today" > '2026-10-08' ]]; }; then
            enabled=false
          fi
          printf 'enabled=%s\n' "$enabled" >> "$GITHUB_OUTPUT"
          printf 'today_kst=%s\n' "$today" >> "$GITHUB_OUTPUT"

      - name: Validate read-only observation script
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/collect-region-transition-observation.sh
          if grep -Ein '(^|[[:space:];])(insert|update|delete|replace|alter|drop|truncate|create|grant|revoke)[[:space:]]' scripts/collect-region-transition-observation.sh; then
            echo 'Mutating SQL is forbidden in the observation script.' >&2
            exit 1
          fi

      - name: Prepare pinned Tunnel SSH transport
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"

      - name: Collect production observation through Tunnel
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          OBSERVATION_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${OBSERVATION_SSH_KEY:?missing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$OBSERVATION_SSH_KEY" > "$RUNNER_TEMP/region-observation-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/region-observation-known-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/region-observation-key" >/dev/null
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/region-observation-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/region-observation-known-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'bash -s' \
            < scripts/collect-region-transition-observation.sh \
            > region-transition-observation.md
          cat region-transition-observation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check public API health
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: curl --fail --silent --show-error --max-time 15 https://api.geupddong.com/api/health

      - name: Remove ephemeral Tunnel credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/region-observation-key" "$RUNNER_TEMP/region-observation-known-hosts"

      - name: Upload observation report
        if: steps.window.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: region-transition-observation-${{ steps.window.outputs.today_kst }}
          path: region-transition-observation.md
          retention-days: 30
          if-no-files-found: error
