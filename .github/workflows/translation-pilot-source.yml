name: Translation pilot source export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-pilot-source
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate server-side aggregate and pilot tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/collect-translation-pilot-source.sh
          bash -n scripts/collect-translation-pilot-report.sh
          python3 -B -m unittest scripts/test_translation_pilot.py
          if grep -Ein '(^|[[:space:];])(insert|update|delete|replace|alter|drop|truncate|create|grant|revoke)[[:space:]]' \
              scripts/collect-translation-pilot-source.sh scripts/collect-translation-pilot-report.sh; then
            echo 'Mutating SQL is forbidden in translation pilot collection.' >&2
            exit 1
          fi

      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"

      - name: Build aggregate report inside production host
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          EXPORT_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${EXPORT_SSH_KEY:?missing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$EXPORT_SSH_KEY" > "$RUNNER_TEMP/translation-pilot-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/translation-pilot-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/translation-pilot-key" >/dev/null
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/translation-pilot-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/translation-pilot-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'bash -s' \
            < scripts/collect-translation-pilot-report.sh \
            > translation-pilot-source-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('translation-pilot-source-report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('sampleCount') != 1000:
              raise SystemExit(f"unexpected sampleCount: {report.get('sampleCount')}")
          if report.get('addressSelectionRule') != 'ROAD_THEN_JIBUN':
              raise SystemExit('unexpected address selection rule')
          if report.get('rawSourceRetained') is not False:
              raise SystemExit('raw source retention must be false')
          if report.get('rawSourceTransferred') is not False:
              raise SystemExit('raw source transfer must be false')
          if sum(report.get('addressKinds', {}).values()) != 1000:
              raise SystemExit('address kind counts do not match sample count')
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cat translation-pilot-source-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral Tunnel credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/translation-pilot-key" "$RUNNER_TEMP/translation-pilot-hosts"
          rm -f -- translation-pilot-source.jsonl

      - name: Upload aggregate pilot report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-pilot-source-report-${{ github.run_id }}
          path: translation-pilot-source-report.json
          retention-days: 30
          if-no-files-found: error
