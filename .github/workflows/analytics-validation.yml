name: Analytics classification validation
on:
  pull_request:
    paths:
      - 'src/**/analytics/**'
      - 'src/main/resources/db/migration/*service_analytics*'
      - 'scripts/*analytics*'
      - '.github/workflows/analytics-validation.yml'
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test future classification, historical preservation and safe activation
        run: |
          chmod +x gradlew
          ./gradlew test --tests '*analytics*' --no-daemon --max-workers=1
          python3 -B -m unittest scripts.test_service_analytics_release_transition
