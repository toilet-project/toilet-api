name: Cache invalidation validation
on:
  push:
    branches: [feature/durable-preview-cache]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Unit tests and disposable MySQL transaction tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --tests '*CacheInvalidation*Test' --tests '*ToiletServiceTest' --tests '*ToiletControllerTest' --no-daemon --console=plain
      - name: Preserve isolated test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-tests-${{ github.run_id }}
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          retention-days: 7
