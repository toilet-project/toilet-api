name: Translation pilot encrypted review export

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful translation pilot run ID
        required: true
      confirmation:
        description: Type EXPORT_REVIEW_100 to export the encrypted review sample
        required: true
      export_public_key_base64:
        description: One-time RSA public key encoded as base64 PEM
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: translation-pilot-review-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate approval and select review sample
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'EXPORT_REVIEW_100'
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          install -d -m 700 "$RUNNER_TEMP/pilot-results" "$RUNNER_TEMP/review-input"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "translation-pilot-results-$SOURCE_RUN_ID" \
            --dir "$RUNNER_TEMP/pilot-results"
          python3 -B scripts/prepare_translation_review_sample.py \
            "$RUNNER_TEMP/pilot-results/translation-pilot-results.jsonl" \
            "$RUNNER_TEMP/review-input"
          test "$(tr ',' '\n' < "$RUNNER_TEMP/review-input/ids.txt" | sort -u | wc -l)" -eq 100

      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"

      - name: Build encrypted transport bundle
        shell: bash
        env:
          EXPORT_PUBLIC_KEY_BASE64: ${{ inputs.export_public_key_base64 }}
          EXPORT_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${EXPORT_PUBLIC_KEY_BASE64:?missing review export public key}"
          : "${EXPORT_SSH_KEY:?missing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          bundle_dir="$RUNNER_TEMP/review-bundle"
          install -d -m 700 "$bundle_dir/input" "$bundle_dir/credentials"
          install -m 600 "$RUNNER_TEMP/review-input/ids.txt" "$bundle_dir/input/ids.txt"
          printf '%s' "$EXPORT_PUBLIC_KEY_BASE64" | base64 -d > "$bundle_dir/credentials/review-public.pem"
          openssl pkey -pubin -in "$bundle_dir/credentials/review-public.pem" -noout
          printf '%s\n' "$EXPORT_SSH_KEY" > "$RUNNER_TEMP/review-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/review-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/review-key" >/dev/null
          tar -czf "$RUNNER_TEMP/review-input.tgz" -C "$bundle_dir" .
          rm -rf -- "$bundle_dir"

      - name: Export encrypted Korean source sample inside production host
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          remote_dir="/tmp/toilet-translation-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          ssh_options=(
            -F /dev/null -i "$RUNNER_TEMP/review-key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/review-hosts"
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519
            -o ForwardAgent=no -o ClearAllForwardings=yes
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
            -o 'ProxyCommand=cloudflared access ssh --hostname %h'
          )
          ssh "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "install -d -m 700 '$remote_dir'"
          ssh -T "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" \
            "umask 077; cat > '$remote_dir/input.tgz'" < "$RUNNER_TEMP/review-input.tgz"
          timeout 10m ssh "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" \
            "bash -s -- '$remote_dir'" < scripts/run-translation-review-export-remote.sh
          ssh -T "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" \
            "cat '$remote_dir/output.tgz'" > "$RUNNER_TEMP/review-output.tgz"
          install -d -m 700 encrypted-review-output
          tar -xzf "$RUNNER_TEMP/review-output.tgz" -C encrypted-review-output
          cp "$RUNNER_TEMP/review-input/review-sample-manifest.json" encrypted-review-output/

      - name: Upload encrypted review source only
        uses: actions/upload-artifact@v4
        with:
          name: translation-review-encrypted-${{ github.run_id }}
          path: encrypted-review-output/
          retention-days: 1
          if-no-files-found: error

      - name: Remove ephemeral credentials and production work directory
        if: always()
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          if [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]] && [[ "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]] \
              && test -f "$RUNNER_TEMP/cloudflared-package/usr/bin/cloudflared" \
              && test -f "$RUNNER_TEMP/review-key" && test -f "$RUNNER_TEMP/review-hosts" \
              && test -n "${TUNNEL_SERVICE_TOKEN_ID:-}" && test -n "${TUNNEL_SERVICE_TOKEN_SECRET:-}" \
              && test -n "${TUNNEL_SSH_USER:-}" && test -n "${TUNNEL_SSH_HOST:-}"; then
            remote_dir="/tmp/toilet-translation-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
            ssh -F /dev/null -T -i "$RUNNER_TEMP/review-key" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/review-hosts" \
              -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
              -o ForwardAgent=no -o ClearAllForwardings=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
              "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" \
              "test '$remote_dir' != / && rm -rf -- '$remote_dir'" || true
          fi
          rm -rf -- "$RUNNER_TEMP/review-bundle" "$RUNNER_TEMP/review-input" "$RUNNER_TEMP/pilot-results"
          rm -f -- "$RUNNER_TEMP/review-input.tgz" "$RUNNER_TEMP/review-output.tgz" \
            "$RUNNER_TEMP/review-key" "$RUNNER_TEMP/review-hosts"
