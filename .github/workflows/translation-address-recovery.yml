name: English address recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RECOVER_ENGLISH_ADDRESSES to save audited official English addresses
        required: true
      max_rows:
        description: Maximum rows to process in this run
        required: true
        default: "500"

permissions:
  contents: read

concurrency:
  group: translation-address-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit approval and recovery tooling
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MAX_ROWS: ${{ inputs.max_rows }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'RECOVER_ENGLISH_ADDRESSES'
          [[ "$MAX_ROWS" =~ ^[0-9]+$ ]]
          test "$MAX_ROWS" -ge 1 && test "$MAX_ROWS" -le 100000
          bash -n scripts/collect-translation-address-recovery-source.sh
          bash -n scripts/apply-translation-address-recovery-results.sh
          bash -n scripts/run-translation-address-recovery-remote.sh
          python3 -B -m unittest scripts/test_translation_address_recovery.py scripts/test_translation_address_recovery_sql.py

      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"

      - name: Build encrypted recovery bundle
        shell: bash
        env:
          JUSO_ENGLISH_API_KEY: ${{ secrets.JUSO_ENGLISH_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          EXPORT_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${JUSO_ENGLISH_API_KEY:?missing Juso English key}"
          : "${KAKAO_REST_API_KEY:?missing Kakao REST key}"
          : "${EXPORT_SSH_KEY:?missing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          bundle_dir="$RUNNER_TEMP/translation-address-bundle"
          install -d -m 700 "$bundle_dir/scripts" "$bundle_dir/credentials"
          install -m 700 scripts/collect-translation-address-recovery-source.sh \
            scripts/apply-translation-address-recovery-results.sh \
            scripts/run-translation-address-recovery-remote.sh "$bundle_dir/scripts/"
          install -m 600 scripts/translation_address_recovery.py \
            scripts/translation_address_recovery_sql.py "$bundle_dir/scripts/"
          printf '%s' "$JUSO_ENGLISH_API_KEY" > "$bundle_dir/credentials/juso.key"
          printf '%s' "$KAKAO_REST_API_KEY" > "$bundle_dir/credentials/kakao.key"
          printf '%s\n' "$EXPORT_SSH_KEY" > "$RUNNER_TEMP/translation-address-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/translation-address-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/translation-address-key" >/dev/null
          tar -czf "$RUNNER_TEMP/translation-address-input.tgz" -C "$bundle_dir" .
          rm -rf -- "$bundle_dir"

      - name: Recover and save official English addresses
        shell: bash
        env:
          MAX_ROWS: ${{ inputs.max_rows }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          remote_dir="/tmp/toilet-translation-address-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          ssh_options=(-F /dev/null -i "$RUNNER_TEMP/translation-address-key" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/translation-address-hosts" -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o 'ProxyCommand=cloudflared access ssh --hostname %h')
          ssh "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "install -d -m 700 '$remote_dir'"
          ssh -T "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "umask 077; cat > '$remote_dir/input.tgz'" < "$RUNNER_TEMP/translation-address-input.tgz"
          timeout 345m ssh -T "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" \
            "bash -s -- '$remote_dir' '$MAX_ROWS'; status=\$?; test \$status -eq 0 || exit \$status; test -s '$remote_dir/output.tgz'" \
            < scripts/run-translation-address-recovery-remote.sh
          ssh -T "${ssh_options[@]}" "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "cat '$remote_dir/output.tgz'" > "$RUNNER_TEMP/translation-address-output.tgz"
          install -d -m 700 translation-address-output
          tar -xzf "$RUNNER_TEMP/translation-address-output.tgz" -C translation-address-output
          cat translation-address-output/translation-address-recovery-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate recovery report only
        uses: actions/upload-artifact@v4
        with:
          name: translation-address-recovery-report-${{ github.run_id }}
          path: translation-address-output/translation-address-recovery-report.json
          retention-days: 90
          if-no-files-found: error

      - name: Remove credentials and production work directory
        if: always()
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]] && [[ "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]] && test -f "$RUNNER_TEMP/cloudflared-package/usr/bin/cloudflared" && test -f "$RUNNER_TEMP/translation-address-key" && test -f "$RUNNER_TEMP/translation-address-hosts" && test -n "${TUNNEL_SERVICE_TOKEN_ID:-}" && test -n "${TUNNEL_SERVICE_TOKEN_SECRET:-}" && test -n "${TUNNEL_SSH_USER:-}" && test -n "${TUNNEL_SSH_HOST:-}"; then
            remote_dir="/tmp/toilet-translation-address-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
            ssh -F /dev/null -T -i "$RUNNER_TEMP/translation-address-key" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/translation-address-hosts" -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o 'ProxyCommand=cloudflared access ssh --hostname %h' "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "test '$remote_dir' != / && rm -rf -- '$remote_dir'" || true
          fi
          rm -rf -- "$RUNNER_TEMP/translation-address-bundle"
          rm -f -- "$RUNNER_TEMP/translation-address-input.tgz" "$RUNNER_TEMP/translation-address-output.tgz" "$RUNNER_TEMP/translation-address-key" "$RUNNER_TEMP/translation-address-hosts"
