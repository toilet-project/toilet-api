# Read-only feature-branch verification. Never merges or runs deployment commands.
name: Maintenance preflight read-only diagnosis
on:
  push:
    branches: [ops/maintenance-preflight-readonly-20260913]
    paths: [.github/workflows/tunnel-deploy-readonly.yml]
permissions:
  contents: read
concurrency:
  group: tunnel-deploy-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'toilet-project/toilet-api' && github.ref == 'refs/heads/ops/maintenance-preflight-readonly-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify pinned official connector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"
      - name: Diagnose maintenance preflight through authenticated Tunnel SSH
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${DEPLOY_SSH_KEY:?missing existing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing verified host key}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tunnel-probe-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/tunnel-probe-known-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/tunnel-probe-key" >/dev/null 2>&1
          ssh-keygen -F geupddong-mini-pc -f "$RUNNER_TEMP/tunnel-probe-known-hosts" >/dev/null
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          ssh_args=(-F /dev/null -T -i "$RUNNER_TEMP/tunnel-probe-key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tunnel-probe-known-hosts"
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519
            -o ForwardAgent=no -o ClearAllForwardings=yes -o LogLevel=ERROR
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2
            -o 'ProxyCommand=cloudflared access ssh --hostname %h'
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST")
          # Fixed remote read-only diagnosis. It inspects metadata and suppresses all secret values.
          if ! output=$(timeout 120s ssh "${ssh_args[@]}" '/usr/bin/python3 -' \
            2>"$RUNNER_TEMP/tunnel-probe-error" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess

          PAUSED = {
              'ACCOUNT_LIFECYCLE_MAINTENANCE': 'true',
              'ACCOUNT_RETENTION_ENABLED': 'false',
              'ACCOUNT_ERASURE_ENABLED': 'false',
              'ERASURE_LEDGER_ENABLED': 'false',
              'ERASURE_LEDGER_CATALOGUE_ENABLED': 'false',
              'ERASURE_CHECKPOINT_ENABLED': 'false',
              'ERASURE_LEDGER_LOCAL_ACCEPTANCE_VERIFIED': 'false',
          }
          IDENTITY = {
              'ERASURE_LEDGER_PROVIDER',
              'ERASURE_LEDGER_LOCAL_DIRECTORY',
              'ERASURE_LEDGER_LOCAL_STORE_ID',
              'ERASURE_LEDGER_REALM',
              'ERASURE_LEDGER_KEYS_JSON',
              'ERASURE_LEDGER_ACTIVE_KEY_ID',
              'ERASURE_CHECKPOINT_GITHUB_TOKEN',
              'ERASURE_CHECKPOINT_DATABASE_EPOCH',
          }
          MAINTENANCE_ROOT = '/home/luha/geupddong-maintenance'
          LEDGER_ROOT = '/home/luha/geupddong-erasure-ledger'
          PROFILE_ENV = Path('/home/luha/.config/geupddong/profile-photo.env')
          PROFILE_NAMES = {
              'PROFILE_PHOTO_R2_ACCESS_KEY_ID',
              'PROFILE_PHOTO_R2_BUCKET',
              'PROFILE_PHOTO_R2_ENDPOINT',
              'PROFILE_PHOTO_R2_SECRET_ACCESS_KEY',
          }

          def emit(name, value):
              print(f'{name}={str(bool(value)).lower()}')

          def emit_commit(role, image):
              match = re.fullmatch(r'[^\s@:]+(?:/[^\s@:]+)*:([a-f0-9]{40})', image or '')
              print(f'{role}.commit={match.group(1) if match else "unrecognized"}')

          def mount_ok(obj, root):
              mounts = [m for m in obj.get('Mounts', []) if m.get('Destination') == root]
              return len(mounts) == 1 and mounts[0].get('Type') == 'bind' \
                  and mounts[0].get('Source') == root and mounts[0].get('RW') is True

          print('MAINTENANCE_DIAGNOSIS_V1')
          for role in ('api', 'batch'):
              inspected = subprocess.run(
                  ['docker', 'inspect', 'toilet-' + role], capture_output=True, check=False,
                  timeout=20, text=True)
              emit(f'{role}.inspect', inspected.returncode == 0)
              if inspected.returncode != 0:
                  continue
              items = json.loads(inspected.stdout)
              emit(f'{role}.single', len(items) == 1)
              if len(items) != 1:
                  continue
              obj = items[0]
              values = {}
              duplicate = False
              for entry in obj.get('Config', {}).get('Env', []):
                  key, _, value = entry.partition('=')
                  duplicate = duplicate or key in values
                  values[key] = value
              emit(f'{role}.running', obj.get('State', {}).get('Running') is True)
              emit(f'{role}.user_1000', obj.get('Config', {}).get('User') == '1000:1000')
              emit(f'{role}.env_unique', not duplicate)
              emit(f'{role}.provider_local', values.get('ERASURE_LEDGER_PROVIDER') == 'LOCAL')
              emit(f'{role}.identity_complete', all(values.get(key) for key in IDENTITY))
              emit(f'{role}.ledger_mount', mount_ok(obj, LEDGER_ROOT))
              emit(f'{role}.maintenance_mount', mount_ok(obj, MAINTENANCE_ROOT))
              emit(f'{role}.maintenance_guard',
                   values.get('ERASURE_MAINTENANCE_LOCK_ENABLED') == 'true'
                   and values.get('ERASURE_MAINTENANCE_DIRECTORY') == MAINTENANCE_ROOT)
              emit(f'{role}.image_sha256', bool(re.fullmatch(r'sha256:[a-f0-9]{64}', obj.get('Image', ''))))
              emit_commit(role, obj.get('Config', {}).get('Image'))
              for key, expected in PAUSED.items():
                  emit(f'{role}.paused.{key}', values.get(key) == expected)

          try:
              root_info = Path(MAINTENANCE_ROOT).lstat()
              lock_info = (Path(MAINTENANCE_ROOT) / '.maintenance.lock').lstat()
              emit('maintenance.root_secure', stat.S_ISDIR(root_info.st_mode)
                   and root_info.st_uid == 1000 and stat.S_IMODE(root_info.st_mode) == 0o700)
              emit('maintenance.lock_secure', stat.S_ISREG(lock_info.st_mode)
                   and lock_info.st_uid == 1000 and stat.S_IMODE(lock_info.st_mode) == 0o600
                   and lock_info.st_nlink == 1 and lock_info.st_size == 0)
          except OSError:
              emit('maintenance.root_secure', False)
              emit('maintenance.lock_secure', False)

          try:
              info = PROFILE_ENV.lstat()
              names = set()
              valid_lines = True
              for raw in PROFILE_ENV.read_text(encoding='utf-8').splitlines():
                  if not raw or raw.lstrip().startswith('#'):
                      continue
                  key, sep, value = raw.partition('=')
                  valid_lines = valid_lines and sep == '=' and bool(value) and key not in names
                  names.add(key)
              emit('profile_env.secure', stat.S_ISREG(info.st_mode)
                   and stat.S_IMODE(info.st_mode) == 0o600
                   and info.st_uid == 1000 and info.st_gid == 1000)
              emit('profile_env.exact_names', valid_lines and names == PROFILE_NAMES)
          except OSError:
              emit('profile_env.secure', False)
              emit('profile_env.exact_names', False)

          for role in ('api', 'batch'):
              result = subprocess.run(
                  ['/home/luha/.local/bin/maintenance-preflight', role],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=60,
                  check=False)
              emit(f'{role}.preflight', result.returncode == 0)
          print('NO_REMOTE_STATE_CHANGED=true')
          PY
          ); then
            if grep -qi 'Permission denied' "$RUNNER_TEMP/tunnel-probe-error"; then
              echo 'FAIL: SSH public-key authentication rejected.'
            elif grep -qi 'host key verification failed\|REMOTE HOST IDENTIFICATION HAS CHANGED' "$RUNNER_TEMP/tunnel-probe-error"; then
              echo 'FAIL: pinned host-key verification failed.'
            else
              echo 'FAIL: Access/SSH transport failed or timed out; no automatic retry.'
            fi
            exit 1
          fi
          grep -qx MAINTENANCE_DIAGNOSIS_V1 <<< "$output"
          grep -qx NO_REMOTE_STATE_CHANGED=true <<< "$output"
          printf '%s\n' "$output"
          echo 'PASS: fixed read-only maintenance diagnosis completed.'
      - name: Remove ephemeral runner credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/tunnel-probe-key" "$RUNNER_TEMP/tunnel-probe-known-hosts" \
            "$RUNNER_TEMP/tunnel-probe-error"
