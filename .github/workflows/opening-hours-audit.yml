name: Opening hours production audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Read-only audit scope (map preview exports public ID/coordinates/filter flags only)
        type: choice
        options: [opening-hours, map-filter-preview]
        default: opening-hours

permissions:
  contents: read

concurrency:
  group: opening-hours-production-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate read-only audit script
        shell: bash
        env:
          AUDIT_SCOPE: ${{ inputs.scope || 'opening-hours' }}
        run: |
          set -euo pipefail
          case "$AUDIT_SCOPE" in
            opening-hours) audit_script=scripts/collect-opening-hours-audit.sh ;;
            map-filter-preview) audit_script=scripts/collect-map-filter-preview.sh ;;
            *) exit 1 ;;
          esac
          bash -n "$audit_script"
          if grep -Ein '(^|[[:space:];])(insert|update|delete|replace|alter|drop|truncate|create|grant|revoke)[[:space:]]' "$audit_script"; then
            echo 'Mutating SQL is forbidden in the audit script.' >&2
            exit 1
          fi

      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"

      - name: Audit production opening hours through Tunnel
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          AUDIT_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
          AUDIT_SCOPE: ${{ inputs.scope || 'opening-hours' }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${AUDIT_SSH_KEY:?missing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$AUDIT_SSH_KEY" > "$RUNNER_TEMP/opening-hours-audit-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/opening-hours-audit-known-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/opening-hours-audit-key" >/dev/null
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          case "$AUDIT_SCOPE" in
            opening-hours) audit_script=scripts/collect-opening-hours-audit.sh; audit_output=opening-hours-audit.md ;;
            map-filter-preview) audit_script=scripts/collect-map-filter-preview.sh; audit_output=map-filter-points.jsonl ;;
            *) exit 1 ;;
          esac
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/opening-hours-audit-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/opening-hours-audit-known-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'bash -s' \
            < "$audit_script" \
            > "$audit_output"
          if [ "$AUDIT_SCOPE" = opening-hours ]; then cat opening-hours-audit.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Validate and package public map snapshot
        if: inputs.scope == 'map-filter-preview'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const points=fs.readFileSync('map-filter-points.jsonl','utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const ids=new Set();
          if (!points.length || points.length>200000) throw Error('Invalid export size');
          for (const row of points) {
            if (!Array.isArray(row) || row.length!==4 || !Number.isSafeInteger(row[0]) || row[0]<1
                || !Number.isFinite(row[1]) || row[1]<32 || row[1]>40
                || !Number.isFinite(row[2]) || row[2]<124 || row[2]>132
                || !Number.isInteger(row[3]) || row[3]<0 || row[3]>15 || ids.has(row[0])) throw Error('Invalid public tuple');
            ids.add(row[0]);
          }
          const data=JSON.stringify({schema:1,exportedAt:new Date().toISOString(),points});
          fs.writeFileSync('map-filter-preview-source.json',data);
          const counts=Object.fromEntries([1,2,4,8,15].map(mask=>[mask,points.filter(p=>(p[3]&mask)===mask).length]));
          const summary=`# Public map filter preview snapshot\n\nRead-only export; no operational deployment or private data.\n\nPublic points: ${points.length}\n\nJSON bytes: ${Buffer.byteLength(data)}; gzip bytes: ${gzipSync(data).length}\n\nPositive flags: ${JSON.stringify(counts)}\n`;
          fs.writeFileSync('map-filter-preview-summary.md',summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          JS

      - name: Remove ephemeral Tunnel credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/opening-hours-audit-key" "$RUNNER_TEMP/opening-hours-audit-known-hosts"

      - name: Upload audit report
        if: always() && inputs.scope != 'map-filter-preview'
        uses: actions/upload-artifact@v4
        with:
          name: opening-hours-production-audit-${{ github.run_id }}
          path: opening-hours-audit.md
          retention-days: 30
          if-no-files-found: error

      - name: Upload public map preview snapshot
        if: inputs.scope == 'map-filter-preview'
        uses: actions/upload-artifact@v4
        with:
          name: map-filter-preview-source-${{ github.run_id }}
          path: |
            map-filter-preview-source.json
            map-filter-preview-summary.md
          retention-days: 3
          if-no-files-found: error
