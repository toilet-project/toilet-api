name: Cache contract production transition
on:
  workflow_dispatch:
    inputs:
      expected_api_commit:
        description: Current production API image commit (40 hex)
        type: string
        required: true
      contract_version:
        description: Explicit target contract
        type: choice
        options: ['1', '2']
        default: '2'
      operation:
        description: Read-only check or one approved configuration change
        type: choice
        options: [check, apply]
        default: check
      deployment_freeze_confirmed:
        description: No other deployments or manual configuration changes
        type: boolean
        default: false
      schema_verified:
        description: Production V2 outbox schema and triggers were independently verified
        type: boolean
        default: false
      web_ready_confirmed:
        description: Production Web receives V2 and shared cache smoke passed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: toilet-api-production
  cancel-in-progress: false
jobs:
  transition:
    if: >-
      github.repository == 'toilet-project/toilet-api' &&
      github.ref == 'refs/heads/main' &&
      vars.CACHE_CONTRACT_RELEASE_APPROVED == 'true' &&
      vars.CACHE_CONTRACT_APPROVED_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact request before credentials
        shell: bash
        env:
          EXPECTED_API_COMMIT: ${{ inputs.expected_api_commit }}
          APPROVED_API_COMMIT: ${{ vars.CACHE_CONTRACT_APPROVED_API_COMMIT }}
          CONTRACT_VERSION: ${{ inputs.contract_version }}
          APPROVED_CONTRACT_VERSION: ${{ vars.WEB_CACHE_CONTRACT_VERSION }}
          OPERATION: ${{ inputs.operation }}
          FREEZE: ${{ inputs.deployment_freeze_confirmed }}
          SCHEMA: ${{ inputs.schema_verified }}
          WEB_READY: ${{ inputs.web_ready_confirmed }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_API_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_API_COMMIT" = "$APPROVED_API_COMMIT"
          test "$CONTRACT_VERSION" = "$APPROVED_CONTRACT_VERSION"
          case "$CONTRACT_VERSION" in 1|2) ;; *) exit 1 ;; esac
          case "$OPERATION" in
            check) ;;
            apply)
              test "$FREEZE" = true
              test "$SCHEMA" = true
              if test "$CONTRACT_VERSION" = 2; then test "$WEB_READY" = true; fi
              ;;
            *) exit 1 ;;
          esac
          python3 -B -m unittest discover -s scripts -p test_cache_contract_transition.py
      - name: Prepare pinned Tunnel client
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"
      - name: Check or apply one cache contract value over pinned SSH
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
          EXPECTED_API_COMMIT: ${{ inputs.expected_api_commit }}
          CONTRACT_VERSION: ${{ inputs.contract_version }}
          OPERATION: ${{ inputs.operation }}
          FREEZE: ${{ inputs.deployment_freeze_confirmed }}
          SCHEMA: ${{ inputs.schema_verified }}
          WEB_READY: ${{ inputs.web_ready_confirmed }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          test "$TUNNEL_SSH_HOST" = ssh-deploy.geupddong.com
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/cache-contract-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/cache-contract-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/cache-contract-key" >/dev/null
          remote="python3 -B - --operation $OPERATION --contract-version $CONTRACT_VERSION --expected-api-commit $EXPECTED_API_COMMIT"
          if test "$OPERATION" = apply; then
            remote="$remote --deployment-freeze-confirmed --schema-verified"
            if test "$WEB_READY" = true; then remote="$remote --web-ready-confirmed"; fi
          fi
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/cache-contract-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/cache-contract-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "$remote" < scripts/cache_contract_transition.py
      - name: Remove runner-only credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/cache-contract-key" "$RUNNER_TEMP/cache-contract-hosts"
