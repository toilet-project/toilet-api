name: Mobile public toilet catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *' # 04:30 Asia/Seoul, after the daily source import
  pull_request:
    paths: ['.github/workflows/mobile-catalog.yml', 'scripts/mobile-data/**', 'mobile-data-worker/**']
permissions:
  contents: read
concurrency:
  group: mobile-public-catalog
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          bash -n scripts/mobile-data/export.sh
          python3 -B -m unittest discover -s scripts/mobile-data -p 'test_*.py'
          node --test mobile-data-worker/worker.test.mjs
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && vars.MOBILE_CATALOG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"
      - name: Export public facilities from a read-only DB snapshot
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          EXPORT_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${EXPORT_SSH_KEY:?missing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$EXPORT_SSH_KEY" > "$RUNNER_TEMP/mobile-catalog-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/mobile-catalog-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/mobile-catalog-key" >/dev/null
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/mobile-catalog-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/mobile-catalog-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'bash -s' < scripts/mobile-data/export.sh > public-catalog.jsonl
      - name: Build and publish immutable catalog, then commit manifest
        env:
          MOBILE_CATALOG_ORIGIN: ${{ vars.MOBILE_CATALOG_ORIGIN }}
          MOBILE_CATALOG_PUBLISH_TOKEN: ${{ secrets.MOBILE_CATALOG_PUBLISH_TOKEN }}
        run: |
          python3 -B scripts/mobile-data/publish.py public-catalog.jsonl catalog-output
          cat catalog-output/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Remove ephemeral credentials and source export
        if: always()
        shell: bash
        run: |
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/mobile-catalog-key" "$RUNNER_TEMP/mobile-catalog-hosts" public-catalog.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-catalog-report-${{ github.run_id }}
          path: catalog-output/report.json
          if-no-files-found: warn
          retention-days: 30
