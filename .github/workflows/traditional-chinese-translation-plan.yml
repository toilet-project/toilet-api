name: Traditional Chinese translation character plan

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read aggregate progress, probe one stale cache event, or stop the verified stuck translation process
        required: false
        default: plan
        type: choice
        options:
          - plan
          - probe-cache
          - stop
      confirmation:
        description: Type STOP_REGIONAL_TRANSLATION only for the stop action
        required: false
      probe_batch_size:
        description: Number of pending cache events to probe without outbox acknowledgement
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '20'
      probe_worker_version:
        description: Optional active Worker version UUID to target during cache probe
        required: false

permissions:
  contents: read

concurrency:
  group: traditional-chinese-translation-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only planner
        run: |
          python3 -B -m unittest scripts/test_traditional_chinese_plan.py
          python3 -B -m unittest scripts/test_probe_traditional_cache_delivery.py
          python3 -m py_compile scripts/plan_traditional_chinese_translation.py
          python3 -m py_compile scripts/probe_traditional_cache_delivery.py
          python3 -m py_compile scripts/stop_traditional_translation.py
      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"
      - name: Count missing texts inside production host
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PROBE_BATCH_SIZE: ${{ inputs.probe_batch_size || '1' }}
          PROBE_WORKER_VERSION: ${{ inputs.probe_worker_version }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          EXPORT_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${EXPORT_SSH_KEY:?missing SSH key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$EXPORT_SSH_KEY" > "$RUNNER_TEMP/traditional-plan-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/traditional-plan-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/traditional-plan-key" >/dev/null
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          if test "$ACTION" = 'stop'; then
            test "$CONFIRMATION" = 'STOP_REGIONAL_TRANSLATION'
            timeout 60s ssh -F /dev/null -T -i "$RUNNER_TEMP/traditional-plan-key" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/traditional-plan-hosts" \
              -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
              -o ForwardAgent=no -o ClearAllForwardings=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
              "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'python3 -' \
              < scripts/stop_traditional_translation.py
            exit 0
          fi
          if test "$ACTION" = 'probe-cache'; then
            test "$CONFIRMATION" = 'PROBE_TRANSLATION_CACHE'
            [[ "$PROBE_BATCH_SIZE" =~ ^(1|20)$ ]]
            [[ -z "$PROBE_WORKER_VERSION" || "$PROBE_WORKER_VERSION" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
            timeout 60s ssh -F /dev/null -T -i "$RUNNER_TEMP/traditional-plan-key" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/traditional-plan-hosts" \
              -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
              -o ForwardAgent=no -o ClearAllForwardings=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
              "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "PROBE_BATCH_SIZE=$PROBE_BATCH_SIZE PROBE_WORKER_VERSION=$PROBE_WORKER_VERSION python3 -" \
              < scripts/probe_traditional_cache_delivery.py \
              > traditional-cache-probe-report.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('traditional-cache-probe-report.json').read_text(encoding='utf-8'))
          if report.get('schema') != 1 or report.get('batchSize') != int(__import__('os').environ['PROBE_BATCH_SIZE']) or report.get('rawSourceExported') is not False:
              raise SystemExit('Invalid cache probe report')
          PY
            cat traditional-cache-probe-report.json >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$ACTION" = 'plan'
          timeout 15m ssh -F /dev/null -T -i "$RUNNER_TEMP/traditional-plan-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/traditional-plan-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'python3 -' \
            < scripts/plan_traditional_chinese_translation.py \
            > traditional-chinese-translation-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('traditional-chinese-translation-plan.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report.get('schema') != 1 or report.get('sourceLanguage') != 'ko' or report.get('rawSourceExported') is not False:
              raise SystemExit('Invalid translation plan')
          targets = report.get('targets', {})
          if set(targets) != {'zh-tw', 'zh-hk'}:
              raise SystemExit('Expected both regional Chinese targets')
          if sum(item['billableInputCharacters'] for item in targets.values()) != report['billableInputCharacters']:
              raise SystemExit('Character totals do not match')
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cat traditional-chinese-translation-plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate only
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: traditional-chinese-translation-plan-${{ github.run_id }}
          path: traditional-chinese-translation-plan.json
      - name: Upload cache probe aggregate only
        if: inputs.action == 'probe-cache'
        uses: actions/upload-artifact@v4
        with:
          name: traditional-cache-probe-${{ github.run_id }}
          path: traditional-cache-probe-report.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove ephemeral Tunnel credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/traditional-plan-key" "$RUNNER_TEMP/traditional-plan-hosts"
