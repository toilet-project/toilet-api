name: Preserve account state during profile photo transition
on:
  workflow_dispatch:
    inputs:
      api_commit:
        description: Approved currently running API image commit (40 hex)
        type: string
        required: true
      batch_commit:
        description: Approved currently running batch image commit (40 hex)
        type: string
        required: true
      operation:
        description: Explicit profile-photo-only transition
        type: choice
        options: [check, mount-disabled, activate, deactivate, inspect-apac-rollback, retire-apac-rollback]
        default: check
      deployment_freeze_confirmed:
        description: Operator confirmed no other deployment or manual configuration change
        type: boolean
        default: false
      apac_cloud_resources_deleted_confirmed:
        description: Operator confirmed the obsolete APAC bucket and token are deleted
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: toilet-api-production
  cancel-in-progress: false
jobs:
  transition:
    if: >-
      github.repository == 'toilet-project/toilet-api' &&
      github.ref == 'refs/heads/main' &&
      vars.PROFILE_PHOTO_RELEASE_APPROVED == 'true' &&
      vars.PROFILE_PHOTO_RELEASE_APPROVED_SHA == github.sha &&
      vars.PROFILE_PHOTO_RELEASE_API_COMMIT == inputs.api_commit &&
      vars.PROFILE_PHOTO_RELEASE_BATCH_COMMIT == inputs.batch_commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate request before accessing transport credentials
        shell: bash
        env:
          API_COMMIT: ${{ inputs.api_commit }}
          BATCH_COMMIT: ${{ inputs.batch_commit }}
          OPERATION: ${{ inputs.operation }}
          FREEZE: ${{ inputs.deployment_freeze_confirmed }}
          APAC_CLOUD_DELETED: ${{ inputs.apac_cloud_resources_deleted_confirmed }}
        run: |
          set -euo pipefail
          [[ "$API_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BATCH_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          case "$OPERATION" in
            check|inspect-apac-rollback) ;;
            mount-disabled|activate|deactivate) test "$FREEZE" = true ;;
            retire-apac-rollback) test "$FREEZE" = true; test "$APAC_CLOUD_DELETED" = true ;;
            *) exit 1 ;;
          esac
          python3 -B -m unittest scripts.test_profile_photo_release_transition
      - name: Prepare pinned Tunnel client
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"
      - name: Run pinned profile-photo-only transition
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
          API_COMMIT: ${{ inputs.api_commit }}
          BATCH_COMMIT: ${{ inputs.batch_commit }}
          OPERATION: ${{ inputs.operation }}
          FREEZE: ${{ inputs.deployment_freeze_confirmed }}
          APAC_CLOUD_DELETED: ${{ inputs.apac_cloud_resources_deleted_confirmed }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          test "$TUNNEL_SSH_HOST" = ssh-deploy.geupddong.com
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/profile-photo-release-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/profile-photo-release-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/profile-photo-release-key" >/dev/null
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          ssh_args=(-F /dev/null -T -i "$RUNNER_TEMP/profile-photo-release-key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/profile-photo-release-hosts"
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519
            -o ForwardAgent=no -o ClearAllForwardings=yes
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
            -o 'ProxyCommand=cloudflared access ssh --hostname %h'
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST")
          if test "$OPERATION" = activate; then
            probe=$(timeout 2m ssh "${ssh_args[@]}" 'python3 -B - --apply-synthetic' \
              < scripts/profile_photo_storage_probe.py)
            python3 -c 'import json,sys; value=json.load(sys.stdin); assert value.get("passed") is True' <<< "$probe"
            echo 'PROFILE_PHOTO_STORAGE_SYNTHETIC_PASS'
          fi
          remote="python3 -B - --operation $OPERATION --api-commit $API_COMMIT --batch-commit $BATCH_COMMIT"
          if test "$OPERATION" != check && test "$OPERATION" != inspect-apac-rollback; then
            test "$FREEZE" = true
            remote="$remote --apply-approved --deployment-freeze-confirmed"
          fi
          if test "$OPERATION" = retire-apac-rollback; then
            test "$APAC_CLOUD_DELETED" = true
            remote="$remote --apac-cloud-resources-deleted-confirmed"
          fi
          timeout 10m ssh "${ssh_args[@]}" "$remote" < scripts/profile_photo_release_transition.py
      - name: Remove runner-only credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/profile-photo-release-key" "$RUNNER_TEMP/profile-photo-release-hosts"
