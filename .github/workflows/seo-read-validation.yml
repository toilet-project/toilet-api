name: SEO read API validation
on:
  push:
    branches: [feature/seo-read-projections]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Unit, controller and disposable MySQL tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --tests '*ToiletSitemap*Test' --tests '*ToiletRegionMySqlTest' --tests '*ToiletServiceTest' --tests '*ToiletControllerTest' --no-daemon --console=plain
