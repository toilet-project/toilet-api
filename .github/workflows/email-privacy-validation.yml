name: Email privacy validation
on:
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: |
          chmod +x ./gradlew
          ./gradlew test --tests 'com.example.toiletapi.auth.*' --no-daemon --console=plain
