name: Preview authentication validation
on:
  push:
    branches: [feature/preview-oauth-origin]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: |
          chmod +x ./gradlew
          ./gradlew test --tests '*PreviewOAuthTest' --tests '*AuthControllerTest' --tests '*ToiletControllerTest' --tests '*DataSyncStatusControllerTest' --tests '*AdminRegionReviewControllerTest' --no-daemon --console=plain
