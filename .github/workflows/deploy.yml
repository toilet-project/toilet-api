name: Toilet API CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: toilet-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-api:latest

      - name: Deploy to Mini PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          port: ${{ secrets.MINI_PC_PORT }}
          username: ${{ secrets.MINI_PC_USERNAME }}
          key: ${{ secrets.MINI_PC_KEY }}
          script: |
            mkdir -p ~/toilet-api
            cd ~/toilet-api

            cat <<EOF > .env
            API_PORT=${{ secrets.API_PORT }}
            SPRING_DB_URL=${{ secrets.SPRING_DB_URL }}
            SPRING_DB_USERNAME=${{ secrets.SPRING_DB_USERNAME }}
            SPRING_DB_PASSWORD=${{ secrets.SPRING_DB_PASSWORD }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            cat <<EOF > compose.yaml
            services:
              redis:
                image: redis:7.4-alpine
                container_name: toilet-redis
                restart: unless-stopped
                command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
                env_file:
                  - .env
                volumes:
                  - redis-data:/data
                networks:
                  - toilet-network
                healthcheck:
                  test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
                  interval: 10s
                  timeout: 3s
                  retries: 5
                  start_period: 10s

              api:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-api:latest
                container_name: toilet-api
                restart: unless-stopped
                env_file:
                  - .env
                depends_on:
                  redis:
                    condition: service_healthy
                ports:
                  - "127.0.0.1:${{ secrets.API_PORT }}:${{ secrets.API_PORT }}"
                networks:
                  - toilet-network

            networks:
              toilet-network:
                external: true

            volumes:
              redis-data:
            EOF

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f --filter "until=24h"
