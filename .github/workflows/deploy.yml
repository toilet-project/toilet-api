name: Toilet API CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: toilet-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node for deployment preflight
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate cache destination and matching signing key
        env:
          CACHE_ENABLED: ${{ vars.WEB_CACHE_REVALIDATION_ENABLED || 'false' }}
          CACHE_ORIGIN: ${{ vars.WEB_CACHE_ORIGIN }}
          CACHE_SECRET_NAME: ${{ vars.WEB_CACHE_ORIGIN == 'https://geupddong.com' && 'WEB_CACHE_PRODUCTION_REVALIDATION_SECRET' || 'WEB_CACHE_REVALIDATION_SECRET' }}
          CACHE_SECRET: ${{ secrets[vars.WEB_CACHE_ORIGIN == 'https://geupddong.com' && 'WEB_CACHE_PRODUCTION_REVALIDATION_SECRET' || 'WEB_CACHE_REVALIDATION_SECRET'] }}
        run: node scripts/check-web-cache-deployment.mjs

      - name: Validate and prepare paused account lifecycle configuration
        id: lifecycle
        env:
          ACCOUNT_LIFECYCLE_DEPLOYMENT_APPROVED: ${{ vars.ACCOUNT_LIFECYCLE_DEPLOYMENT_APPROVED || 'false' }}
          ACCOUNT_LIFECYCLE_MAINTENANCE: 'true'
          ACCOUNT_RETENTION_ENABLED: 'false'
          ACCOUNT_ERASURE_ENABLED: 'false'
          ERASURE_LEDGER_ENABLED: 'false'
          ERASURE_LEDGER_CATALOGUE_ENABLED: 'false'
          ERASURE_LEDGER_ENDPOINT: ${{ vars.ERASURE_LEDGER_ENDPOINT }}
          ERASURE_LEDGER_REALM: ${{ vars.ERASURE_LEDGER_REALM || 'production' }}
          ERASURE_LEDGER_BUCKET: ${{ vars.ERASURE_LEDGER_BUCKET || 'geupddong-account-erasure-ledger' }}
          ERASURE_LEDGER_ACTIVE_KEY_ID: ${{ vars.ERASURE_LEDGER_ACTIVE_KEY_ID || 'k1' }}
          ERASURE_LEDGER_ACCESS_KEY_ID: ${{ secrets.ERASURE_LEDGER_ACCESS_KEY_ID }}
          ERASURE_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.ERASURE_LEDGER_SECRET_ACCESS_KEY }}
          ERASURE_LEDGER_KEYS_JSON: ${{ secrets.ERASURE_LEDGER_KEYS_JSON }}
          ERASURE_CHECKPOINT_ENABLED: 'false'
          ERASURE_CHECKPOINT_GITHUB_TOKEN: ${{ secrets.ERASURE_CHECKPOINT_GITHUB_TOKEN }}
          ERASURE_CHECKPOINT_DATABASE_EPOCH: ${{ vars.ERASURE_CHECKPOINT_DATABASE_EPOCH }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: node scripts/prepare-account-lifecycle.mjs api

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-api:${{ github.sha }}

      - name: Deploy to Mini PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          port: ${{ secrets.MINI_PC_PORT }}
          username: ${{ secrets.MINI_PC_USERNAME }}
          key: ${{ secrets.MINI_PC_KEY }}
          script: |
            set -eu
            umask 077
            mkdir -p ~/toilet-api
            cd ~/toilet-api

            # Preserve the previous configuration and image ID; never prune rollback images here.
            rollback_dir=$(mktemp -d "$PWD/rollback-preparation.XXXXXXXX")
            for file in .env .account-lifecycle.env compose.yaml; do
              if [ -f "$file" ]; then cp -p -- "$file" "$rollback_dir/"; fi
            done
            if docker container inspect toilet-api >/dev/null 2>&1; then
              docker container inspect --format '{{.Image}}' toilet-api > "$rollback_dir/api-image-id"
            fi

            cat <<EOF > .env
            API_PORT=${{ secrets.API_PORT }}
            SPRING_DB_URL=${{ secrets.SPRING_DB_URL }}
            SPRING_DB_USERNAME=${{ secrets.SPRING_DB_USERNAME }}
            SPRING_DB_PASSWORD=${{ secrets.SPRING_DB_PASSWORD }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AUTH_ADMIN_BOOTSTRAP_EMAILS=${{ secrets.AUTH_ADMIN_BOOTSTRAP_EMAILS }}
            WEB_CACHE_REVALIDATION_ENABLED=${{ vars.WEB_CACHE_REVALIDATION_ENABLED || 'false' }}
            WEB_CACHE_ORIGIN=${{ vars.WEB_CACHE_ORIGIN }}
            WEB_CACHE_REVALIDATION_SECRET=${{ secrets[vars.WEB_CACHE_ORIGIN == 'https://geupddong.com' && 'WEB_CACHE_PRODUCTION_REVALIDATION_SECRET' || 'WEB_CACHE_REVALIDATION_SECRET'] }}
            EOF

            # Only base64 crosses the shell boundary; JSON and dollar signs remain literal.
            umask 077
            printf '%s' '${{ steps.lifecycle.outputs.redisPayload }}' | base64 --decode >> .env
            printf '%s' '${{ steps.lifecycle.outputs.payload }}' | base64 --decode > .account-lifecycle.env
            chmod 600 .env .account-lifecycle.env

            cat <<'EOF' > compose.yaml
            services:
              redis:
                image: redis:7.4-alpine
                container_name: toilet-redis
                restart: unless-stopped
                command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
                env_file:
                  - .env
                # Do not mount/load the old redis-data volume. Its files require separate cleanup approval.
                tmpfs:
                  - /data:rw,noexec,nosuid,size=64m
                networks:
                  - toilet-network
                healthcheck:
                  test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
                  interval: 10s
                  timeout: 3s
                  retries: 5
                  start_period: 10s
                logging:
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "5"

              api:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-api:${{ github.sha }}
                container_name: toilet-api
                restart: unless-stopped
                env_file:
                  - .env
                  - .account-lifecycle.env
                depends_on:
                  redis:
                    condition: service_healthy
                ports:
                  - "127.0.0.1:${{ secrets.API_PORT }}:${{ secrets.API_PORT }}"
                networks:
                  - toilet-network
                logging:
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "5"

            networks:
              toilet-network:
                external: true

            EOF

            docker compose config --quiet
            docker compose pull
            docker compose up -d --wait --wait-timeout 120 redis api
