allprojects {
    afterEvaluate {
        tasks.register('growthHttpFixture', JavaExec) {
            dependsOn tasks.named('testClasses')
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'com.example.toiletapi.review.GrowthHttpFixture'
            doFirst {
                if (!System.getenv('GROWTH_FIXTURE_METADATA')) throw new GradleException('GROWTH_FIXTURE_METADATA is required')
                args System.getenv('GROWTH_FIXTURE_METADATA')
            }
            jvmArgs '-Duser.timezone=Asia/Seoul'
        }
    }
}
