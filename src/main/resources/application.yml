account:
  lifecycle:
    maintenance: ${ACCOUNT_LIFECYCLE_MAINTENANCE:true}
  erasure:
    enabled: ${ACCOUNT_ERASURE_ENABLED:false}
  retention:
    enabled: ${ACCOUNT_RETENTION_ENABLED:false}

web-cache:
  enabled: ${WEB_CACHE_REVALIDATION_ENABLED:false}
  origin: ${WEB_CACHE_ORIGIN:}
  secret: ${WEB_CACHE_REVALIDATION_SECRET:}
  poll-ms: 5000

server:
  port: ${API_PORT}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # OAuth state/return target uses JSESSIONID before JWT cookies are issued.
        # Explicit flags also apply when the trusted proxy connects over HTTP.
        secure: true
        http-only: true
        same-site: lax

spring:
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        connectionTimeZone: Asia/Seoul
        forceConnectionTimeZoneToSession: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
            redirect-uri: https://api.geupddong.com/login/oauth2/code/google
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: https://api.geupddong.com/login/oauth2/code/kakao
            scope: profile_nickname, account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

kakao:
  api:
    key: ${KAKAO_REST_API_KEY}

auth:
  frontend-base-url: ${AUTH_FRONTEND_BASE_URL:https://geupddong.com}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  admin-bootstrap:
    # OAuth 로그인 구현 시, 여기 등록된 "이메일 인증 완료" 계정에만 최초 ADMIN 역할을 부여한다.
    # 값은 서버 환경변수 AUTH_ADMIN_BOOTSTRAP_EMAILS로만 주입한다.
    emails: ${AUTH_ADMIN_BOOTSTRAP_EMAILS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: toilet-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
erasure:
  ledger:
    enabled: ${ERASURE_LEDGER_ENABLED:false}
    provider: ${ERASURE_LEDGER_PROVIDER:R2}
    local-acceptance-verified: ${ERASURE_LEDGER_LOCAL_ACCEPTANCE_VERIFIED:false}
    local-directory: ${ERASURE_LEDGER_LOCAL_DIRECTORY:}
    local-store-id: ${ERASURE_LEDGER_LOCAL_STORE_ID:}
    domestic-acceptance-verified: ${ERASURE_LEDGER_DOMESTIC_ACCEPTANCE_VERIFIED:false}
    catalogue-enabled: ${ERASURE_LEDGER_CATALOGUE_ENABLED:false}
    realm: ${ERASURE_LEDGER_REALM:production}
    bucket: ${ERASURE_LEDGER_BUCKET:geupddong-account-erasure-ledger}
    endpoint: ${ERASURE_LEDGER_ENDPOINT:}
    access-key-id: ${ERASURE_LEDGER_ACCESS_KEY_ID:}
    secret-access-key: ${ERASURE_LEDGER_SECRET_ACCESS_KEY:}
    active-key-id: ${ERASURE_LEDGER_ACTIVE_KEY_ID:k1}
    keys-json: ${ERASURE_LEDGER_KEYS_JSON:}
