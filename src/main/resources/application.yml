server:
  port: ${TOILET_API_PORT:8080}

spring:
  application:
    name: toilet-api
  datasource:
    url: ${TOILET_API_DATASOURCE_URL}
    username: ${TOILET_API_DATASOURCE_USERNAME}
    password: ${TOILET_API_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
